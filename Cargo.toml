[package]
name = "async-modbus"
description = "A lightweight asynchronous Modbus protocol implementation for embedded environments."
license = "MIT"
documentation = "https://docs.rs/async-modbus"
repository = "https://github.com/akeamc/async-modbus"
version = "0.6.0"
edition = "2024"

[features]
default = ["embedded-io", "std"]
embedded-io = ["dep:embedded-io-async"]
std = ["thiserror/std"]
defmt = ["dep:defmt", "defmt-or-log/defmt"]
log = ["dep:log", "defmt-or-log/log"]

[dependencies]
crc = "3.4.0"
defmt = { version = "1.0.1", optional = true }
defmt-or-log = { version = "0.2.3", default-features = false }
embedded-io-async = { version = "0.7.0", optional = true }
log = { version = "0.4.29", optional = true }
thiserror = { version = "2.0.18", default-features = false }
zerocopy = "0.8.40"
zerocopy-derive = "0.8.40"

[build-dependencies]
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

[dev-dependencies]
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }
hex-literal = "1.1.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["rtu-server"] }
tokio-serial = "5.4.5"
